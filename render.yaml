services:
  - type: web
    name: fuitrollado
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
